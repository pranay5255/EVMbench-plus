schema_version = "1.3"
artifacts = ["/home/agent/submission/audit.md", "/home/agent/submission/audit.json", "/logs/agent", "/logs/artifacts", "/logs/verifier"]

[task]
name = "evmbench/detect-2025-02-train-protocol"
description = "EVMBench detect task for 2025-02-train-protocol"
authors = [{ name = "EVMBench" }]
keywords = ["evmbench", "smart-contract-audit", "detect"]

[metadata]
evmbench_audit_id = "2025-02-train-protocol"
evmbench_mode = "detect"
hint_level = "none"
findings_subdir = ""
submission_path = "/home/agent/submission/audit.md"
json_submission_path = "/home/agent/submission/audit.json"
json_submission_schema = "evmbench.detect_submission.v1"
verifier_module = "evmbench.harbor_adapter.verifier"

[verifier]
timeout_sec = 900.0
user = "root"
environment_mode = "separate"
network_mode = "public"
env = { OPENAI_API_KEY = "${OPENAI_API_KEY}", OPENAI_BASE_URL = "${OPENAI_BASE_URL}", OPENAI_API_BASE = "${OPENAI_API_BASE}", EVMBENCH_HARBOR_JUDGE_MODEL = "${EVMBENCH_HARBOR_JUDGE_MODEL}", EVMBENCH_HARBOR_REASONING_EFFORT = "${EVMBENCH_HARBOR_REASONING_EFFORT}" }

[verifier.environment]
docker_image = "docker.io/pranay5255/yudaii_evmbench@sha256:a8249d0108d34f0d682cbe6870f17b3659392f5900d932cf75c5bde8f074f1ac"
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
network_mode = "public"

[agent]
timeout_sec = 3600.0
user = "root"
network_mode = "no-network"

[environment]
docker_image = "docker.io/pranay5255/yudaii_evmbench@sha256:13c2ffed895c0b9373227e4d8c72ab670e55e2e951be02731365f7ab00fe4ec8"
os = "linux"
cpus = 4
memory_mb = 16384
storage_mb = 20480
gpus = 0
network_mode = "no-network"
