schema_version = "1.3"
artifacts = ["/home/agent/submission/audit.md", "/home/agent/submission/audit.json", "/logs/agent", "/logs/artifacts", "/logs/verifier"]

[task]
name = "evmbench/detect-2025-07-securitize-onofframp"
description = "EVMBench detect task for 2025-07-securitize-onofframp"
authors = [{ name = "EVMBench" }]
keywords = ["evmbench", "smart-contract-audit", "detect"]

[metadata]
evmbench_audit_id = "2025-07-securitize-onofframp"
evmbench_mode = "detect"
hint_level = "none"
findings_subdir = ""
submission_path = "/home/agent/submission/audit.md"
json_submission_path = "/home/agent/submission/audit.json"
json_submission_schema = "evmbench.detect_submission.v1"
verifier_module = "evmbench.harbor_adapter.verifier"

[verifier]
timeout_sec = 900.0
user = "root"
environment_mode = "separate"
network_mode = "public"
env = { OPENAI_API_KEY = "${OPENAI_API_KEY}", OPENAI_BASE_URL = "${OPENAI_BASE_URL}", OPENAI_API_BASE = "${OPENAI_API_BASE}", EVMBENCH_HARBOR_JUDGE_MODEL = "${EVMBENCH_HARBOR_JUDGE_MODEL}", EVMBENCH_HARBOR_REASONING_EFFORT = "${EVMBENCH_HARBOR_REASONING_EFFORT}" }

[verifier.environment]
docker_image = "docker.io/pranay5255/yudaii_evmbench@sha256:76a3bcd95bea624b14eb506977f40d3f1cbf751e7381271fc056eb5053b6fd02"
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
network_mode = "public"

[agent]
timeout_sec = 3600.0
user = "root"
network_mode = "no-network"

[environment]
docker_image = "docker.io/pranay5255/yudaii_evmbench@sha256:359677e21c8bbb13409ceb85b5c2e089e9d1260c2fa42e041873eb51efaa02ed"
os = "linux"
cpus = 4
memory_mb = 16384
storage_mb = 20480
gpus = 0
network_mode = "no-network"
