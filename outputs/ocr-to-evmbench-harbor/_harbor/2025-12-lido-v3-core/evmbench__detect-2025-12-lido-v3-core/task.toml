schema_version = "1.3"
artifacts = ["/home/agent/submission/audit.md", "/home/agent/submission/audit.json", "/logs/agent", "/logs/artifacts", "/logs/verifier"]

[task]
name = "evmbench/detect-2025-12-lido-v3-core"
description = "EVMBench detect task for 2025-12-lido-v3-core"
authors = [{ name = "EVMBench" }]
keywords = ["evmbench", "smart-contract-audit", "detect"]

[metadata]
evmbench_audit_id = "2025-12-lido-v3-core"
evmbench_mode = "detect"
hint_level = "none"
findings_subdir = ""
submission_path = "/home/agent/submission/audit.md"
json_submission_path = "/home/agent/submission/audit.json"
json_submission_schema = "evmbench.detect_submission.v1"
verifier_module = "evmbench.harbor_adapter.verifier"

[verifier]
timeout_sec = 900.0
user = "root"
environment_mode = "separate"
network_mode = "public"
env = { OPENAI_API_KEY = "${OPENAI_API_KEY}", OPENAI_BASE_URL = "${OPENAI_BASE_URL}", OPENAI_API_BASE = "${OPENAI_API_BASE}", EVMBENCH_HARBOR_JUDGE_MODEL = "${EVMBENCH_HARBOR_JUDGE_MODEL}", EVMBENCH_HARBOR_REASONING_EFFORT = "${EVMBENCH_HARBOR_REASONING_EFFORT}" }

[verifier.environment]
docker_image = "docker.io/pranay5255/yudaii_evmbench@sha256:85bc90283899514489f8f071d10efea3f37f866e2984c56b36f96cd4eea6f2c4"
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
network_mode = "public"

[agent]
timeout_sec = 3600.0
user = "root"
network_mode = "no-network"

[environment]
docker_image = "docker.io/pranay5255/yudaii_evmbench@sha256:3130711c5e63897c149e714f301c8cf18fc92ac883e86830a7b56bf33ad89fb8"
os = "linux"
cpus = 4
memory_mb = 16384
storage_mb = 20480
gpus = 0
network_mode = "no-network"
